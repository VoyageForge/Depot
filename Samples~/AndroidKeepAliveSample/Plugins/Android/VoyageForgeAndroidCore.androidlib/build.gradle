apply plugin: 'android-library'

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    resolutionStrategy.force 'androidx.concurrent:concurrent-futures:1.1.0'
    resolutionStrategy.force 'androidx.annotation:annotation-experimental:1.4.1'
}

dependencies {
    implementation fileTree(dir: 'bin', include: ['*.jar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.8.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
}

repositories {
    flatDir {
        dirs '..'
    }
    google()
    mavenCentral()
}

android {
    namespace "com.voyageforge.android.core"

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileSdkVersion 35
    buildToolsVersion '34.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 35
    }

    lintOptions {
        abortOnError false
    }
}
